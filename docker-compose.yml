services:
  miner:
    build: .
    container_name: kick-points-miner
    restart: unless-stopped
    volumes:
      - ./config.json:/app/config.json:ro
      - ./logs:/app/logs
    environment:
      - TZ=UTC
      - PORT=4000
      # Telegram bot token (can also be set in config.json)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      # Render external URL for keep-alive pings (/wake command)
      - RENDER_EXTERNAL_URL=${RENDER_EXTERNAL_URL:-}
      - SERVICE_URL=${SERVICE_URL:-}
      # Interval in seconds between keep-alive pings (default 840 = 14 min)
      - KEEPALIVE_INTERVAL=${KEEPALIVE_INTERVAL:-840}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
